<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Allow HTTPS/HTTP guests inside <webview>; default-src 'self' alone blocks embedded browser loads in Electron/Chromium. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https: http: data: blob:; frame-src 'self' https: http: data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: http: ws: wss:;">
  <title>ESPOT Service</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* min-height: 0 lets the webview flex child get real height (otherwise it can stay 0px tall). */
    body { display: flex; flex-direction: column; min-height: 0; }

    /* ── Toolbar ─────────────────────────────────────────────────────────────── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 10px;
      height: 48px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
      -webkit-app-region: drag;
    }

    /* Buttons / inputs must opt out of drag */
    #toolbar > * { -webkit-app-region: no-drag; }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.12s, color 0.12s;
    }
    .nav-btn:hover:not(:disabled) { background: #1e293b; color: #e2e8f0; }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .nav-btn svg { width: 14px; height: 14px; display: block; }

    /* ── URL Bar ─────────────────────────────────────────────────────────────── */
    #url-bar {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 7px;
      background: #1e293b;
      border-radius: 20px;
      padding: 0 14px;
      height: 32px;
      max-width: 900px;
      margin: 0 auto;
      min-width: 0;
      -webkit-app-region: no-drag;
    }

    #security-icon { flex-shrink: 0; line-height: 0; }

    #url-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-size: 12.5px;
      min-width: 0;
      caret-color: #3b82f6;
    }
    #url-input::placeholder { color: #475569; }
    #url-input:focus { color: #f8fafc; }

    /* ── Webview ─────────────────────────────────────────────────────────────── */
    webview {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      display: flex;
    }
  </style>
</head>
<body>
  <div id="toolbar">

    <!-- Back -->
    <button class="nav-btn" id="btn-back" title="Go back" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <!-- Forward -->
    <button class="nav-btn" id="btn-forward" title="Go forward" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <!-- Reload / Stop -->
    <button class="nav-btn" id="btn-reload" title="Reload">
      <svg id="icon-reload" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      <svg id="icon-stop" style="display:none" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
           stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <!-- URL Bar -->
    <div id="url-bar">
      <span id="security-icon"></span>
      <input
        type="text"
        id="url-input"
        placeholder="Search or enter address"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

  </div>

  <!-- The actual service site is loaded inside this webview -->
  <webview id="wv" allowpopups></webview>

  <script>
    // ── Read launch params from the query string (set by main process via loadFile) ──
    const params    = new URLSearchParams(window.location.search);
    const initUrl   = params.get('url')       || 'about:blank';
    const partition = params.get('partition') || '';

    // ── DOM refs ──────────────────────────────────────────────────────────────
    const wv         = document.getElementById('wv');
    const urlInput   = document.getElementById('url-input');
    const btnBack    = document.getElementById('btn-back');
    const btnFwd     = document.getElementById('btn-forward');
    const btnReload  = document.getElementById('btn-reload');
    const iconReload = document.getElementById('icon-reload');
    const iconStop   = document.getElementById('icon-stop');
    const secIcon    = document.getElementById('security-icon');

    // Inline SVGs for the security indicator
    const SVG_LOCK   = '<svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
    const SVG_SEARCH = '<svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';

    // ── Helpers ───────────────────────────────────────────────────────────────
    function setUrlDisplay(url) {
      urlInput.value   = url;
      secIcon.innerHTML = url.startsWith('https://') ? SVG_LOCK : SVG_SEARCH;
    }

    function refreshNavButtons() {
      btnBack.disabled = !wv.canGoBack();
      btnFwd.disabled  = !wv.canGoForward();
    }

    function toLoadableUrl(raw) {
      const s = raw.trim();
      if (!s) return '';
      if (s.startsWith('http://') || s.startsWith('https://') || s.startsWith('file://')) return s;
      if (/^[a-z0-9-]+(\.[a-z]{2,})/i.test(s) && !s.includes(' ')) return 'https://' + s;
      return 'https://www.google.com/search?q=' + encodeURIComponent(s);
    }

    // ── Wire up webview ───────────────────────────────────────────────────────
    if (partition) wv.setAttribute('partition', partition);
    wv.setAttribute('src', initUrl);

    wv.addEventListener('did-navigate', function(e) {
      setUrlDisplay(e.url);
      refreshNavButtons();
    });

    wv.addEventListener('did-navigate-in-page', function(e) {
      if (e.isMainFrame) {
        setUrlDisplay(e.url);
        refreshNavButtons();
      }
    });

    wv.addEventListener('load-commit', function(e) {
      if (e.isMainFrame) setUrlDisplay(e.url);
    });

    wv.addEventListener('did-start-loading', function() {
      iconReload.style.display = 'none';
      iconStop.style.display   = '';
      btnReload.title = 'Stop';
    });

    wv.addEventListener('did-stop-loading', function() {
      iconReload.style.display = '';
      iconStop.style.display   = 'none';
      btnReload.title = 'Reload';
      refreshNavButtons();
    });

    wv.addEventListener('dom-ready', refreshNavButtons);

    // ── Toolbar button handlers ───────────────────────────────────────────────
    btnBack.addEventListener('click',   function() { wv.goBack(); });
    btnFwd.addEventListener('click',    function() { wv.goForward(); });
    btnReload.addEventListener('click', function() {
      if (iconStop.style.display !== 'none') wv.stop(); else wv.reload();
    });

    // ── URL bar submit ────────────────────────────────────────────────────────
    urlInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var url = toLoadableUrl(urlInput.value);
        if (url) wv.loadURL(url);
      }
    });

    urlInput.addEventListener('focus', function() { urlInput.select(); });

    // ── Initialise display ────────────────────────────────────────────────────
    setUrlDisplay(initUrl);
  </script>
</body>
</html>
