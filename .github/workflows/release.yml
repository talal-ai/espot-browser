name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # Required so electron-builder can create/update the release and upload latest.yml + installers

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set version from tag (so release tag matches built app version)
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          npm pkg set version=$version
        working-directory: frontend

      - name: Clean install dependencies
        run: |
          Remove-Item -Path package-lock.json -ErrorAction SilentlyContinue
          npm install
        working-directory: frontend

      - name: Build and release
        env:
          # Built-in Actions token (contents: write above). Do not use secrets.GH_TOKEN here:
          # a stale PAT in that secret causes 401 Bad credentials during publish.
          GH_TOKEN: ${{ github.token }}
        run: npm run release
        working-directory: frontend

      # electron-builder only uploads latest.yml when release is created as draft (known bug).
      # So we create as draft then publish here so auto-updater can see the release.
      - name: Publish release (so latest.yml and installers are visible to auto-updater)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit ${{ github.ref_name }} --repo ${{ github.repository }} --draft=false
